# CS.91000 Graduation Research — Full Rerun Experiment Configuration
# Incorporates all post-pilot fixes:
# - Literal-preserving GumTree normalizer + balanced header-noise cancellation
# - Enclosing-method body inlining in both Control and Treatment prompts (Nov 25 email)
# - Strict assertion validity primary + passing/failing baseline FDG
# - 3 repeats per (bug, condition) with transient 429 retry-backoff

paths:
  data_dir: "data"
  curated_manifest: "data/curated_bugs_80.json"
  exclusion_log: "data/exclusion_log_80.json"
  prefix_root: "tmp/prefix_workspaces"       # Agent MCP server operates ONLY here
  postfix_root: "tmp/postfix_workspaces"     # Evaluation harness ONLY (unreachable by agent)
  results_dir: "data/results_rerun"
  figures_dir: "docs/figures_rerun"

tools:
  defects4j_bin: "defects4j"
  gumtree_bin: "gumtree"
  gumtree_java_home: "/usr/lib/jvm/java-17-openjdk-amd64"
  compile_timeout_sec: 180
  test_timeout_sec: 180
  coverage_timeout_sec: 240

dataset:
  projects: ["Lang", "Math"]
  require_single_method_fix: true
  min_viable_bugs: 50
  max_bugs: null
  strip_triggering_tests: true
  filter_ast_header_noise: true

agent:
  provider: "openai"
  model: "gpt-4o-2024-08-06"
  temperature: 0.2                           # Non-zero temperature for 3-repeat variance estimation
  max_tokens: 4096
  max_retries: 5
  max_tool_calls_per_retry: 6
  api_base_url: null
  inline_enclosing_method: true              # Prof. Yoo Nov 25 Q3: inline enclosing pre-fix method context
  repeats: 3

evaluation:
  fdg_alpha: 0.5
  dstar_star: 2
  acc_n_values: [1, 3, 5, 10]
  strict_assertion_only: true                # Proposal Sec. 4.5 strict assertion validity primary
  include_passing_baseline_tests: true
  max_baseline_passing_tests: 25
